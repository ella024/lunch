<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>점심 메뉴 룰렛</title>
<style>
  :root{
    color-scheme: light;
    --stage:#FFFFFF;
    --panel:#1E2130;
    --panel-2:#262A3C;
    --line:#33364A;
    --text:#241C12;
    --muted:#6F675C;
    --gold:#FFF3A3;
    --gold-deep:#F4D45F;
    --paper:#FFFBF2;
    --ink:#241C12;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--stage);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .app{width:100%;max-width:440px;}

  .eyebrow{
    text-transform:uppercase;letter-spacing:0.16em;font-size:11px;
    font-weight:700;color:var(--gold);margin:0 0 6px;
  }
  header{text-align:center;margin-bottom:6px;}
  header h1{font-size:25px;font-weight:800;margin:0 0 6px;letter-spacing:-0.3px;}
  header p{margin:0;color:var(--muted);font-size:13.5px;}

  .wheel-wrap{
    position:relative;
    width:min(82vw,380px);
    aspect-ratio:1/1;
    margin:26px auto 22px;
  }
  .wheel-wrap::before{
    content:'';
    position:absolute;
    inset:-16%;
    background:radial-gradient(circle, rgba(255,243,163,0.45), transparent 68%);
    z-index:0;
    pointer-events:none;
  }
  .wheel-wrap svg{
    position:relative;z-index:1;width:100%;height:100%;display:block;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,0.45));
  }
  #wheelGroup{
    transform-origin:300px 300px;
    transition:transform 4.2s cubic-bezier(0.15,0.65,0.15,1);
  }
  .seg-text{
    font-weight:700;fill:#241C12;
    paint-order:stroke fill;stroke:#FFFDF5;stroke-width:3px;stroke-linejoin:round;
  }

  .hub{
    position:absolute;top:50%;left:50%;
    width:25%;aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:3px solid var(--paper);
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    color:var(--ink);font-weight:800;font-size:clamp(12px,3.4vw,15px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,0.4);
    letter-spacing:-0.2px;
    transition:transform .15s ease;
    z-index:3;
  }
  .hub:active{transform:translate(-50%,-50%) scale(0.94);}
  .hub:disabled{filter:grayscale(0.35);cursor:not-allowed;}

  .result{
    background:var(--paper);color:var(--ink);
    border-radius:8px 8px 20px 20px;
    border-top:3px dashed var(--gold-deep);
    padding:18px 18px 20px;
    text-align:center;
    box-shadow:0 12px 26px rgba(0,0,0,0.35);
    min-height:84px;
    display:flex;flex-direction:column;justify-content:center;
    margin-bottom:16px;
  }
  .result .eyebrow{color:#B8752A;margin-bottom:4px;}
  .result .name{font-size:22px;font-weight:800;line-height:1.3;}
  .result .name.placeholder{font-size:14.5px;font-weight:500;color:#8A7F6E;}
  @keyframes pop{0%{transform:scale(0.86);opacity:0.3;}100%{transform:scale(1);opacity:1;}}
  .result .name.pop{animation:pop .35s ease;}

  .history{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:6px;}
  .history::-webkit-scrollbar{height:4px;}
  .history .chip{
    flex:0 0 auto;background:var(--panel-2);border:1px solid var(--line);
    padding:6px 12px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap;
  }

  .manage-toggle{
    display:flex;align-items:center;gap:5px;width:fit-content;
    margin:18px auto 0;
    background:none;border:1px solid var(--line);color:var(--muted);
    font-size:13px;cursor:pointer;padding:7px 14px;border-radius:999px;
  }
  .manage-toggle:hover{border-color:var(--gold);color:var(--text);}
  .manage-toggle svg{transition:transform .2s ease;}
  .manage-toggle.open svg{transform:rotate(180deg);}

  .manage-panel{display:none;margin-top:12px;}
  .manage-panel.open{display:block;}
  .manage-actions{display:flex;gap:8px;margin-bottom:10px;}
  .manage-actions button{
    flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);
    background:#FFFFFF;color:var(--text);font-size:12.5px;cursor:pointer;
  }
  .manage-actions button:hover{border-color:var(--gold);}
  .checklist{
    display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;
    background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:14px;
  }
  .checklist label{
    display:flex;align-items:center;gap:7px;font-size:13px;
    padding:4px 2px;cursor:pointer;
  }
  .checklist input{accent-color:var(--gold);width:16px;height:16px;flex:0 0 auto;}
  .checklist label.off{color:var(--muted);text-decoration:line-through;}

  .reset-link{
    display:block;width:fit-content;margin:14px auto 0;font-size:12px;
    color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;
  }
  .reset-link:hover{color:var(--text);}

  button:focus-visible, input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  @media (prefers-reduced-motion: reduce){
    #wheelGroup{transition-duration:0.6s;}
    .result .name.pop{animation:none;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">Today's Lunch</p>
    <h1>점심 메뉴 룰렛</h1>
    <p>돌리면 끝.</p>
  </header>

  <div class="wheel-wrap">
    <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
      <circle cx="300" cy="300" r="282" fill="none" stroke="#FFF3A3" stroke-width="4"></circle>
      <g id="wheelGroup"></g>
      <polygon points="280,6 320,6 300,54" style="fill:#FFF3A3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));"></polygon>
    </svg>
    <button id="spinBtn" class="hub">돌리기</button>
  </div>

  <div class="result">
    <div class="eyebrow">오늘의 선택</div>
    <div class="name placeholder" id="resultName" aria-live="polite">돌려서 골라보세요</div>
  </div>

  <div class="history" id="historyRow"></div>

  <button class="manage-toggle" id="manageToggle">
    항목 관리
    <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 3L5 7L9 3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="manage-panel" id="managePanel">
    <div class="manage-actions">
      <button id="selectAll" type="button">전체 선택</button>
      <button id="selectNone" type="button">전체 해제</button>
    </div>
    <div class="checklist" id="checklist"></div>
    <button class="reset-link" id="resetBtn" type="button">초기화</button>
  </div>
</div>

<script>
(function(){
  var items = [
    "광평","류창희국수","솥내음","이태리부대찌개","진땡이","양평해장국",
    "전주현대옥","써브웨이","스타벅스","허수아비돈까스","월출산","중국집",
    "삼계탕","순대국","청국장","육전국밥","한식뷔페","쌀국수",
    "은하수면옥","커리인","비마이게스트(샐러드)","남노식당","투썸플레이스","포스톤즈"
  ];
  var N = items.length;
  var seg = 360/N;
  var palette = ["#FFF8CC","#FFF3A3","#FFEF8A","#FFF6BC","#FFEFA0","#FFF9D6","#FCE676","#FFF1AD"];
  var cx=300, cy=300, R=280, textR=176;
  var SVGNS = "http://www.w3.org/2000/svg";

  function polar(r, angleDeg){
    var rad = angleDeg*Math.PI/180;
    return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
  }
  function textRotation(mid){
    var r = mid-90;
    r = ((r%360)+360)%360; if(r>180) r-=360;
    if(r>90 || r<-90){ r+=180; r=((r%360)+360)%360; if(r>180) r-=360; }
    return r;
  }
  function fontSizeFor(len){
    if(len<=3) return 16;
    if(len<=6) return 14;
    if(len<=8) return 12.5;
    return 11;
  }

  var wheelGroup = document.getElementById('wheelGroup');
  items.forEach(function(label,i){
    var start=i*seg, end=start+seg, mid=start+seg/2;
    var p1=polar(R,start), p2=polar(R,end);
    var path=document.createElementNS(SVGNS,'path');
    path.setAttribute('d', 'M '+cx+' '+cy+' L '+p1.x.toFixed(2)+' '+p1.y.toFixed(2)+' A '+R+' '+R+' 0 0 1 '+p2.x.toFixed(2)+' '+p2.y.toFixed(2)+' Z');
    path.setAttribute('fill', palette[i%palette.length]);
    path.setAttribute('stroke', '#FFFDF5');
    path.setAttribute('stroke-width', '2');
    wheelGroup.appendChild(path);

    var pos = polar(textR, mid);
    var rot = textRotation(mid);
    var text=document.createElementNS(SVGNS,'text');
    text.setAttribute('x', pos.x.toFixed(2));
    text.setAttribute('y', pos.y.toFixed(2));
    text.setAttribute('text-anchor','middle');
    text.setAttribute('dominant-baseline','middle');
    text.setAttribute('transform', 'rotate('+rot.toFixed(2)+' '+pos.x.toFixed(2)+' '+pos.y.toFixed(2)+')');
    text.setAttribute('font-size', fontSizeFor(label.length));
    text.setAttribute('class','seg-text');
    text.textContent = label;
    wheelGroup.appendChild(text);
  });

  // ---- persisted state ----
  var EXCLUDE_KEY='lunch_roulette_excluded_v1';
  var HISTORY_KEY='lunch_roulette_history_v1';
  var excluded = new Set();
  var history = [];

  var checklistEl=document.getElementById('checklist');
  var historyRow=document.getElementById('historyRow');
  var resultName=document.getElementById('resultName');
  var spinBtn=document.getElementById('spinBtn');

  function renderChecklist(){
    checklistEl.innerHTML='';
    items.forEach(function(name){
      var label=document.createElement('label');
      var isOff=excluded.has(name);
      if(isOff) label.classList.add('off');
      var input=document.createElement('input');
      input.type='checkbox';
      input.checked=!isOff;
      input.addEventListener('change',function(){
        if(input.checked) excluded.delete(name); else excluded.add(name);
        label.classList.toggle('off', !input.checked);
        saveExcluded();
      });
      label.appendChild(input);
      label.appendChild(document.createTextNode(name));
      checklistEl.appendChild(label);
    });
  }

  function renderHistory(){
    historyRow.innerHTML='';
    if(history.length===0){
      historyRow.style.display='none';
      return;
    }
    historyRow.style.display='flex';
    history.forEach(function(h){
      var chip=document.createElement('div');
      chip.className='chip';
      chip.textContent=h.name;
      historyRow.appendChild(chip);
    });
  }

  function loadState(){
    var p1 = Promise.resolve().then(function(){
      return window.storage.get(EXCLUDE_KEY);
    }).then(function(r){
      if(r && r.value) excluded=new Set(JSON.parse(r.value));
    }).catch(function(){});
    var p2 = Promise.resolve().then(function(){
      return window.storage.get(HISTORY_KEY);
    }).then(function(r2){
      if(r2 && r2.value) history=JSON.parse(r2.value);
    }).catch(function(){});
    Promise.all([p1,p2]).then(function(){
      renderChecklist();
      renderHistory();
    });
  }
  function saveExcluded(){
    try{
      Promise.resolve(window.storage.set(EXCLUDE_KEY, JSON.stringify(Array.from(excluded)))).catch(function(e){console.error(e);});
    }catch(e){console.error(e);}
  }
  function saveHistory(){
    try{
      Promise.resolve(window.storage.set(HISTORY_KEY, JSON.stringify(history.slice(0,8)))).catch(function(e){console.error(e);});
    }catch(e){console.error(e);}
  }

  // ---- spin ----
  var currentRotation=0, spinning=false;
  spinBtn.addEventListener('click', function(){
    if(spinning) return;
    var candidates = items.filter(function(it){ return !excluded.has(it); });
    if(candidates.length===0){
      resultName.classList.add('placeholder');
      resultName.textContent='항목을 최소 1개는 선택해주세요';
      return;
    }
    spinning=true;
    spinBtn.disabled=true;
    resultName.classList.add('placeholder');
    resultName.textContent='고르는 중...';

    var choice=candidates[Math.floor(Math.random()*candidates.length)];
    var segIndex=items.indexOf(choice);
    var segMid=segIndex*seg+seg/2;
    var baseTarget=(360-segMid)%360;
    var extraSpins=5+Math.floor(Math.random()*3);
    var delta=((baseTarget-currentRotation)%360+360)%360;
    currentRotation=currentRotation+delta+360*extraSpins;
    wheelGroup.style.transform='rotate('+currentRotation+'deg)';

    function onEnd(e){
      if(e.propertyName!=='transform') return;
      wheelGroup.removeEventListener('transitionend', onEnd);
      spinning=false;
      spinBtn.disabled=false;
      resultName.classList.remove('placeholder');
      resultName.textContent=choice;
      resultName.classList.remove('pop'); void resultName.offsetWidth; resultName.classList.add('pop');
      history.unshift({name:choice, ts:Date.now()});
      history=history.slice(0,8);
      saveHistory();
      renderHistory();
    }
    wheelGroup.addEventListener('transitionend', onEnd);
  });

  document.getElementById('manageToggle').addEventListener('click', function(){
    this.classList.toggle('open');
    document.getElementById('managePanel').classList.toggle('open');
  });
  document.getElementById('selectAll').addEventListener('click', function(){
    excluded.clear(); renderChecklist(); saveExcluded();
  });
  document.getElementById('selectNone').addEventListener('click', function(){
    excluded=new Set(items); renderChecklist(); saveExcluded();
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    excluded=new Set();
    history=[];
    renderChecklist();
    renderHistory();
    saveExcluded();
    saveHistory();
  });

  loadState();
})();
</script>
</body>
</html>
